name: Format, Release, and Publish

on:
  push:
    branches:
      - master

permissions:
  contents: write
  id-token: write

jobs:
  format-release-publish:
    name: Format, create release, publish to PyPI
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/gix-cli/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff formatter
        run: ruff format .

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "style: apply ruff formatting"
            git push
          fi

      - name: Extract current version
        id: current
        run: |
          VERSION=$(grep -m1 '^version' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get latest tag
        id: latest_tag
        run: |
          TAG=$(git tag --sort=-version:refname | head -n 1)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Check if release already exists
        id: tag_check
        run: |
          VERSION="v${{ steps.current.outputs.version }}"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Collect changelog
        if: steps.tag_check.outputs.exists == 'false'
        id: changelog
        run: |
          LAST_TAG="${{ steps.latest_tag.outputs.tag }}"

          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s" HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s" "$LAST_TAG"..HEAD)
          fi

          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION="v${{ steps.current.outputs.version }}"

          BODY="${{ steps.changelog.outputs.commits }}

          ---
          Install:
          \`\`\`
          pip install gix-cli --upgrade
          \`\`\`"

          git tag "$VERSION"
          git push origin "$VERSION"

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "$BODY"

      - name: Install build tools
        run: pip install build hatchling

      - name: Clean build files
        run: rm -rf dist build *.egg-info

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        if: steps.tag_check.outputs.exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1