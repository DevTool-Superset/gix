[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gix-cli"
version = "0.1.2"
readme = "README.md"
description = "CLI tool for managing multiple git sub-repositories"
requires-python = ">=3.12"

dependencies = [
    "typer>=0.16.0,<0.17.0",
    "rich>=14.0.0,<15.0.0",
    "tomlkit>=0.13.0,<0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "ruff>=0.16.0,<0.17.0",
]

[project.scripts]
gix = "gix.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["gix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]