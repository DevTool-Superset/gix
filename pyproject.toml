[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gix-cli"
version = "3.0.0"
readme = "README.md"
description = "CLI tool for managing multiple git sub-repositories"
requires-python = ">=3.12"

dependencies = [
    "typer>=0.16.0,<0.17.0",
    "rich>=14.0.0,<15.0.0",
    "tomlkit>=0.13.0,<0.14.0",
    "setuptools<70",
    "pexpect==4.9.0",
    "pywinpty==3.0.5; sys_platform == 'win32'"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "ruff>=0.16.0,<0.17.0",
]

[project.scripts]
gix = "gix.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["gix"]

