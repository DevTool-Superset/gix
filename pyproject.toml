[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gix-cli"
version = "0.1.1"
readme = "README.md"
description = "CLI tool for managing multiple git sub-repositories"
requires-python = ">=3.12"

dependencies = [
    "typer>=0.16.0,<0.17.0",
    "rich>=14.0.0,<15.0.0",
    "questionary>=2.1.0,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "rainbow-tqdm>=0.1.5,<0.2.0",
    "tqdm>=4.67.1,<5.0.0",
    "prompt-toolkit>=3.0.51,<4.0.0",
    "appdirs==1.4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "ruff>=0.16.0,<0.17.0",
]

[project.scripts]
gix = "gix.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["gix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]